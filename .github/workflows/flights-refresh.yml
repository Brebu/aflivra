name: flights-refresh

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: flights-refresh
  cancel-in-progress: true

jobs:
  relay:
    name: Relay the Romanian airspace flight states to the seed store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relay (exit 2 = adsb.lol itself errored this tour, recorded as a warning; our own infrastructure failures stay red)
        env:
          AFLIVRA_SEED_BASE: ${{ vars.AFLIVRA_SEED_BASE }}
          AFLIVRA_REFRESH_TOKEN: ${{ secrets.AFLIVRA_REFRESH_TOKEN }}
        run: |
          set +e
          node scripts/relay-flights.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::adsb.lol a răspuns cu eroare sau ruta a respins forma fluxului în această tură (relaia nu a livrat pozițiile tocmai atunci) — reîmprospătarea reia la următoarea tură programată, săptămânal."
            exit 0
          fi
          exit "$code"
