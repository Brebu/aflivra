name: corpora-refresh

# Import zilnic sau declanșat manual al corpusurilor statice „surse românești”:
# Cloudflare permite maximum 5 declanșări programate — toate ocupate de grupurile
# Worker-ului (pulse/living/feeds/research/registers) — deci tura zilnică de corpus
# rulează ca GitHub Action: descarcă exporturile oficiale (SITUR, AMCCRS, EIDA,
# LMI), regenerează corpusurile, trece porțile de integritate și deschide un PR cu
# dovada SHA-256 — reîmprospătarea corpusului e o decizie revizuită, nu o
# pushare directă. Sursele live (SEN/POSF/TEMPO) NU se ating aici: ele au rutele
# proprii cu TTL în Worker.
on:
  workflow_dispatch:
    inputs:
      source:
        description: Corpus to import
        type: choice
        default: all
        options: [all, situr, amccrs, eida, lmi]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: corpora-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate static corpora (SITUR, AMCCRS, EIDA, LMI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CORPUS_SOURCE: ${{ inputs.source || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile
      - name: Install poppler-utils (LMI extraction uses pdftotext -layout)
        run: sudo apt-get update -q && sudo apt-get install -y poppler-utils
      - name: Branch for the refresh PR
        run: git checkout -b corpora/refresh-$(date -u +%Y-%m-%d)
      - name: Import SITUR registries (Excel exports; header detected by content)
        if: env.CORPUS_SOURCE == 'all' || env.CORPUS_SOURCE == 'situr'
        run: node scripts/import-situr-snapshot.mjs
      - name: Import AMCCRS register (nonce stays in this offline script, never the Worker)
        if: env.CORPUS_SOURCE == 'all' || env.CORPUS_SOURCE == 'amccrs'
        run: node scripts/import-amccrs-snapshot.mjs
      - name: Import EIDA seismic history (per-year slices under the service limit)
        if: env.CORPUS_SOURCE == 'all' || env.CORPUS_SOURCE == 'eida'
        run: node scripts/import-eida-snapshot.mjs
      - name: Import LMI 2015 Bucharest (official PDF; column anchors per audited parse)
        if: env.CORPUS_SOURCE == 'all' || env.CORPUS_SOURCE == 'lmi'
        run: node scripts/import-lmi-snapshot.mjs
      - name: Integrity gate — counts, honest gaps, SHA-256 proofs
        run: node scripts/verify-corpus-refresh.mjs --base-ref HEAD
      - name: Preserve validated imports for review, including a blocked PR step
        uses: actions/upload-artifact@v4
        with:
          name: corpora-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public/situr
            public/amccrs
            public/eida
            public/lmi
            public/data/snapshot-transport.json
          retention-days: 14
      - name: Typecheck (the readers see the regenerated corpus through the same contracts)
        run: corepack pnpm exec tsc --noEmit
      - name: Stage the regenerated corpora (real corpus dirs + transport proofs)
        id: stage
        run: |
          git add public/situr public/amccrs public/eida public/lmi public/data/snapshot-transport.json
          if git diff --cached --quiet; then
            echo "Sursele nu au schimbat conținutul corpusurilor — zi liniștită, fără commit și fără PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Corpusurile regenerate diferă de cele comise — commit + PR de reîmprospătare."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit the regenerated corpora
        if: steps.stage.outputs.changed == 'true'
        run: |
          git config user.name "aflivra-corpus-bot"
          git config user.email "corpus-bot@users.noreply.github.com"
          git commit -m "corpus(surse-romanesti): reîmprospătare zilnică $(date -u +%Y-%m-%d) — SITUR/AMCCRS/EIDA/LMI" \
            -m "AI: opencode/opus,sonnet
          Human: Ciprian-Alexandru-Lucian Brebu

          Co-authored-by: opencode <noreply@anthropic.com>
          Co-authored-by: Ciprian-Alexandru-Lucian Brebu <dev@brebu.workers.dev>"
      - name: Publish the refresh branch (a same-day rerun overwrites it, never duplicates)
        if: steps.stage.outputs.changed == 'true'
        run: |
          BRANCH="corpora/refresh-$(date -u +%Y-%m-%d)"
          git push origin "HEAD:refs/heads/$BRANCH" --force
      - name: Open (or reuse) the refresh PR
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CORPORA_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="corpora/refresh-$(date -u +%Y-%m-%d)"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo "Există deja un PR deschis pe $BRANCH (rerulare) — branch-ul forțat la reședință îl actualizează, nu se deschide altul."
            exit 0
          fi
          CORPORA_BODY_FILE="$RUNNER_TEMP/corpora-refresh-body.md"
          printf 'Corpusuri cerute: `%s`.\n\n' "$CORPUS_SOURCE" > "$CORPORA_BODY_FILE"
          cat >> "$CORPORA_BODY_FILE" <<'BODY'
          Importurile selectate descarcă datele oficiale și regenerează copia statică. Sursele disponibile sunt SITUR, AMCCRS, EIDA și LMI 2015 București. SEN/POSF/TEMPO au rutele proprii în Worker.

          Validare: `node scripts/verify-corpus-refresh.mjs --base-ref HEAD` — numărătorile, lipsurile, clasele, acoperirea și SHA-256 sunt verificate; pierderile de peste 10% opresc importul. Artifact-ul păstrează corpusurile validate pentru revizuire.

          Datele din aplicație se schimbă după validarea și integrarea acestui PR, apoi deploy. Un import reușit nu certifică singur actualizarea producției.
          BODY
          gh pr create --title "Corpus: reîmprospătare $(date -u +%Y-%m-%d) ($CORPUS_SOURCE)" \
            --body-file "$CORPORA_BODY_FILE" --base main --head "$BRANCH"
      - name: Explain a blocked publishing step
        if: failure() && steps.stage.outputs.changed == 'true'
        run: |
          echo 'Importurile validate sunt păstrate în artifact. Verifică eroarea pasului de publicare: politica repository-ului poate interzice crearea PR-urilor cu GITHUB_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Activează Allow GitHub Actions to create and approve pull requests sau configurează CORPORA_PR_TOKEN cu acces la acest repository. Acest run eșuat nu certifică o actualizare în producție.' >> "$GITHUB_STEP_SUMMARY"
